<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview Logo Mirra</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .preview-box {
            background: white;
            border-radius: 20px;
            padding: 60px;
            margin-bottom: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .preview-box.dark {
            background: #1a1a1a;
        }
        .title {
            color: white;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 30px;
            text-align: center;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        .subtitle {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }
        .dark .subtitle {
            color: white;
        }
        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 120px;
        }
        .color-info {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin-top: 30px;
        }
        .color-box {
            display: inline-block;
            width: 100px;
            height: 100px;
            border-radius: 10px;
            margin: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .color-label {
            display: block;
            text-align: center;
            margin-top: 10px;
            font-weight: 600;
            color: #333;
        }
        .colors-grid {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        h3 {
            text-align: center;
            color: #333;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">🎨 Preview Logo Mirra - ReadyPOS</h1>
        
        <!-- Light Mode -->
        <div class="preview-box">
            <div class="subtitle">☀️ Light Mode</div>
            <div class="logo-container">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 70" width="420" height="105">
                    <defs>
                        <style>
                            .letter-m { fill: #FFD32D; }
                            .letter-irra { fill: #1565C0; }
                            .tagline { fill: #1565C0; font-size: 8px; font-family: Arial, sans-serif; letter-spacing: 2px; }
                        </style>
                    </defs>
                    
                    <!-- Letter M (Kuning) -->
                    <path class="letter-m" d="M 20 15 L 20 50 L 28 50 L 28 28 L 38 45 L 46 45 L 56 28 L 56 50 L 64 50 L 64 15 L 54 15 L 42 35 L 30 15 Z"/>
                    
                    <!-- Letter i (Biru) -->
                    <circle class="letter-irra" cx="78" cy="20" r="4"/>
                    <rect class="letter-irra" x="74" y="27" width="8" height="23" rx="2"/>
                    
                    <!-- Letter r (Biru) -->
                    <path class="letter-irra" d="M 95 27 L 95 50 L 103 50 L 103 35 Q 103 27 115 27 L 115 27 Q 115 27 115 27 L 115 27 L 115 20 Q 103 20 103 27 Z"/>
                    
                    <!-- Letter r (Biru) -->
                    <path class="letter-irra" d="M 125 27 L 125 50 L 133 50 L 133 35 Q 133 27 145 27 L 145 27 Q 145 27 145 27 L 145 27 L 145 20 Q 133 20 133 27 Z"/>
                    
                    <!-- Letter a (Biru) -->
                    <path class="letter-irra" d="M 165 27 Q 155 27 155 37 Q 155 47 165 47 Q 170 47 173 44 L 173 47 Q 173 52 165 52 Q 160 52 157 50 L 155 56 Q 160 59 167 59 Q 181 59 181 47 L 181 27 L 173 27 L 173 30 Q 170 27 165 27 Z M 165 33 Q 173 33 173 40 Q 173 47 165 47 Q 163 47 163 40 Q 163 33 165 33 Z"/>
                    
                    <!-- Tagline -->
                    <text class="tagline" x="195" y="35">TEMAN SETIA</text>
                    <text class="tagline" x="195" y="47">USAHA ANDA</text>
                </svg>
            </div>
        </div>

        <!-- Dark Mode -->
        <div class="preview-box dark">
            <div class="subtitle">🌙 Dark Mode</div>
            <div class="logo-container">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 70" width="420" height="105">
                    <defs>
                        <style>
                            .letter-m-dark { fill: #FFD32D; }
                            .letter-irra-dark { fill: #FFFFFF; }
                            .tagline-dark { fill: #FFFFFF; font-size: 8px; font-family: Arial, sans-serif; letter-spacing: 2px; }
                        </style>
                    </defs>
                    
                    <!-- Letter M (Kuning) -->
                    <path class="letter-m-dark" d="M 20 15 L 20 50 L 28 50 L 28 28 L 38 45 L 46 45 L 56 28 L 56 50 L 64 50 L 64 15 L 54 15 L 42 35 L 30 15 Z"/>
                    
                    <!-- Letter i (Putih) -->
                    <circle class="letter-irra-dark" cx="78" cy="20" r="4"/>
                    <rect class="letter-irra-dark" x="74" y="27" width="8" height="23" rx="2"/>
                    
                    <!-- Letter r (Putih) -->
                    <path class="letter-irra-dark" d="M 95 27 L 95 50 L 103 50 L 103 35 Q 103 27 115 27 L 115 27 Q 115 27 115 27 L 115 27 L 115 20 Q 103 20 103 27 Z"/>
                    
                    <!-- Letter r (Putih) -->
                    <path class="letter-irra-dark" d="M 125 27 L 125 50 L 133 50 L 133 35 Q 133 27 145 27 L 145 27 Q 145 27 145 27 L 145 27 L 145 20 Q 133 20 133 27 Z"/>
                    
                    <!-- Letter a (Putih) -->
                    <path class="letter-irra-dark" d="M 165 27 Q 155 27 155 37 Q 155 47 165 47 Q 170 47 173 44 L 173 47 Q 173 52 165 52 Q 160 52 157 50 L 155 56 Q 160 59 167 59 Q 181 59 181 47 L 181 27 L 173 27 L 173 30 Q 170 27 165 27 Z M 165 33 Q 173 33 173 40 Q 173 47 165 47 Q 163 47 163 40 Q 163 33 165 33 Z"/>
                    
                    <!-- Tagline -->
                    <text class="tagline-dark" x="195" y="35">TEMAN SETIA</text>
                    <text class="tagline-dark" x="195" y="47">USAHA ANDA</text>
                </svg>
            </div>
        </div>

        <!-- Color Palette -->
        <div class="color-info">
            <h3>🎨 Palette Warna Mirra</h3>
            <div class="colors-grid">
                <div>
                    <div class="color-box" style="background: #FFD32D;"></div>
                    <span class="color-label">Kuning Mirra<br>#FFD32D</span>
                </div>
                <div>
                    <div class="color-box" style="background: #1565C0;"></div>
                    <span class="color-label">Biru Mirra<br>#1565C0</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
